<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Migas Amigas Panadería</title>
	<link rel="stylesheet" href="css/index.css" />
	<link rel="stylesheet" href="css/cards.css">
</head>
<body>
	 <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
	    <tr>
	       <td>
		  <header>
			<div class="logo">
				<h1>Migas Amigas</h1>
			</div>
			<nav class="nav">
				<a href="#inicio" data-i18n="navInicio">Inicio</a>
				<a href="#panaderia" data-i18n="navPanaderia">Panadería</a>
				<a href="#dulceria" data-i18n="navPasteleria">Pastelería-Bollería</a>
				<a href="#empanadas" data-i18n="navEmpanadas">Empanadas</a>
				<a href="#contacto" data-i18n="navContacto">Contacto</a>
			</nav>
			<div class="lang-selector">
				<button type="button" class="lang-btn" data-lang="es" aria-label="Español" aria-pressed="true" title="Español">
					<svg class="flag-icon" viewBox="0 0 30 20" role="img" aria-hidden="true">
						<rect width="30" height="20" fill="#AA151B" />
						<rect y="5" width="30" height="10" fill="#F1BF00" />
					</svg>
				</button>
				<button type="button" class="lang-btn" data-lang="pt" aria-label="Português" aria-pressed="false" title="Português">
					<svg class="flag-icon" viewBox="0 0 30 20" role="img" aria-hidden="true">
						<rect width="12" height="20" fill="#66382E" />
						<rect x="12" width="18" height="20" fill="#66382E" />
						<circle cx="12" cy="10" r="3.5" fill="#FFCC00" />
						<circle cx="12" cy="10" r="2.1" fill="#FFFFFF" />
					</svg>
				</button>
			</div>
		  </header>
	       </td>
	    </tr>

	    <tr>
	       <td>
		  <main>

		     <section >
				<h3 data-i18n="seccionPanaderia">Panadería</h3>
			<div  class="card-gallery" id="panaderia">
			</div>
		     </section>

		     <section >
				<h3 data-i18n="seccionDulceria">Dulcería</h3>
			<div class="card-gallery" id="dulceria">
			</div>
		     </section>

		     <section  >
				<h3 data-i18n="seccionEmpanadas">Empanadas</h3>
			<div class="card-gallery" id="empanadas">
			</div>
		     </section>

		  </main>
	       </td>
	    </tr>
	    <tr>
	       <td>
			   <footer class="footer" id="contacto">
				   <img class="logo" src="/assets/capital/logo.png" width="215" height="86">
				   <h4 data-i18n="horarios">Horarios</h4>
				   <p data-i18n="sabado">Lunes a sábado: 8:00 - 12:00 / 16:00 - 20:30</p>
				   <p data-i18n="domingo">Domingo: 8:00 - 13:00</p>

				   <h4 data-i18n="contactos">Contacto</h4>
				   <p>C/Dr. Joaquín Artiles, 18, 35260 Agüimes, Las Palmas, Spain</p>
				   <p>+34 7596572369</p>
			   </footer>
	       </td>
	    </tr>
	 </table>
	<script src="js/index.js" type="module">
	</script>
</body>
</html>
