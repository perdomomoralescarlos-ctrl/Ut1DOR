<!DOCTYPE html>
<!--
  cards.html — Página demo de la galería de tarjetas.
  Contiene solo el contenedor vacío; en index.html las tarjetas se generan
  por JavaScript (js/index.js) a partir de los datos de js/data/.
-->
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="css/cards.css">
	<title>Galería de tarjetas — Migas Amigas</title>
</head>
<body>

	<!-- Contenedor de la galería: aquí se insertan las tarjetas generadas. -->
	 <div id="section1" class="card-gallery row row-cols-1 row-cols-md-3 g-4 justify-content-center">

	 </div>
      <!--
        Ejemplo estático de la estructura de una tarjeta, por si se necesita
        maquetar una a mano sin JavaScript.

	<article class="card card-section card-closed" tabindex="0">
	   <img src="assets/pan/pan-con-masa-madre.jpg" alt="" class="card-img-top card-image">

	   <div class="card-body card-content-container">
	       <h3 class="card-title">
		  Nombre del plato
	       </h3>
	       <div class="card-content-paragraph-container">
		  <p class="card-text">
		     El mejor plato del mundo señor, sushi con hamburguesa mezclado con pan de oro con caviar
		  </p>
	       </div>
	   </div>

	</article>
      -->
</body>
</html>
