<!DOCTYPE html>
<!--
  cards.html — Página demo de la galería de tarjetas con Bootstrap.
  Contiene una tarjeta de ejemplo; en index.html las tarjetas se generan
  por JavaScript (js/index.js) a partir de los datos de js/data/.
-->
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<title>Galería de tarjetas — Migas Amigas</title>
</head>
<body class="bg-body-tertiary p-4">

	<div class="container">
		<h1 class="h4 mb-4">Galería de tarjetas</h1>

		<!-- Contenedor de la galería: aquí se insertan las tarjetas generadas. -->
		<div id="section1" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">
			<!-- Ejemplo estático de una tarjeta. -->
			<div class="col">
				<article class="card h-100 shadow-sm">
					<div class="ratio ratio-16x9">
						<img src="assets/pan/pan-con-masa-madre.jpg" class="w-100 h-100 object-fit-cover" alt="Pan de masa madre">
					</div>
					<div class="card-body">
						<h2 class="card-title h6 fw-bold">Pan de masa madre</h2>
						<p class="card-text small text-body-secondary mb-0">Fermentación lenta, corteza crujiente y miga llena de aroma.</p>
					</div>
				</article>
			</div>
		</div>
	</div>

</body>
</html>
